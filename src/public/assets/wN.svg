<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400">
  <defs>
    <!-- Soft Drop Shadow (Matches reference board pieces) -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Main 3D Pearl-White Body Gradient (Lit from top-left) -->
    <linearGradient id="whiteKnightBody" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e4e7eb" />
      <stop offset="100%" stop-color="#b4bac2" />
    </linearGradient>

    <!-- Soft Specular Highlight for Head & Neck -->
    <linearGradient id="whiteHeadHighlight" x1="0%" y1="0%" x2="75%" y2="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Horizontal Cylindrical Gradient for White Pedestal Tiers -->
    <linearGradient id="whiteBaseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2c7ce" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#dce0e5" />
      <stop offset="100%" stop-color="#9ea4ae" />
    </linearGradient>

    <!-- Crisp Top Edge Rim Light -->
    <linearGradient id="whiteEdgeLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Centered & Scaled White Knight Group -->
  <g transform="translate(8.4, 2.9) scale(1.9)" filter="url(#dropShadow)">
    
    <!-- 1. Unified Knight Head & Neck Silhouette -->
    <path 
      d="M 22,10 
         C 32.5,11 38.5,18 38,38.5 
         L 14.5,38.5 
         C 14.5,30 24.5,32 23.5,18 
         C 22.5,21.5 18,25.2 15.8,26.8 
         C 13,28.8 13.1,31.2 11,31 
         C 10,30.1 12.2,28 11,28 
         C 10,28 11.1,29.2 10,30 
         C 8.8,30 6,30.8 6,26 
         C 6,23.8 11.8,14.2 12,14 
         C 12.5,13.2 13.8,12 14,10.5 
         C 13.3,9.5 13.5,8.5 13.5,7.5 
         C 14.5,6.5 16.5,10 16.5,10 
         L 18.5,10 
         C 18.5,10 19.3,8 21,7 
         C 22,7 22,10 22,10 Z"
      fill="url(#whiteKnightBody)"
      stroke="#969ca6"
      stroke-width="0.35"
      stroke-linejoin="round"
    />

    <!-- 2. Smooth 3D Inner Highlight (Forehead, Snout, and Chest Curve) -->
    <path 
      d="M 21.2,8.3
         C 20,8.8 19,10.4 18.5,10.4
         L 16.2,10.4
         C 15.8,10.4 14.7,8.2 14.1,8.4
         C 13.9,9.2 14.6,10.2 14.5,10.8
         C 14.2,12.2 12.8,13.8 12.5,14.4
         C 11.5,16 6.8,24 6.8,25.8
         C 6.8,28.8 8.4,29.2 9.5,29.1
         C 10.2,27.2 12,26.8 15,25.2
         C 18,23.5 22.5,19.5 23.8,15.5
         C 26.5,22 17,30 16,37.8
         L 25,37.8
         C 25.5,29 31,20 26,12.5
         C 24.5,10.8 22.5,10.5 21.5,10.4 Z"
      fill="url(#whiteHeadHighlight)"
    />

    <!-- 3. Subtle Back-Mane Rim Shading (Adds 3D depth on the right edge) -->
    <path 
      d="M 22.5,10.3 C 31.8,11.3 37.3,18 37,38 L 35.4,38 C 35.6,19 30.5,12.2 22.5,10.8 Z"
      fill="#8c939e"
      fill-opacity="0.25"
    />

    <!-- 4. Recessed Carved Eye & Nostril -->
    <!-- Nostril -->
    <ellipse cx="8.5" cy="26.2" rx="0.6" ry="0.9" transform="rotate(-20 8.5 26.2)" fill="#7c828d" />
    <!-- Eye Socket -->
    <circle cx="14.5" cy="15.8" r="1.3" fill="#8d949e" />
    <circle cx="14.5" cy="15.8" r="0.8" fill="#525760" />
    <circle cx="14.2" cy="15.5" r="0.35" fill="#ffffff" fill-opacity="0.9" />

    <!-- 5. Tiered Pedestal Base (Matches the Reference Set's Flared Base) -->
    <!-- Upper Base Collar -->
    <path 
      d="M 12.5,37.5 L 35.5,37.5 C 36.3,37.5 36.8,38.2 36.8,39 L 11.2,39 C 11.2,38.2 11.7,37.5 12.5,37.5 Z" 
      fill="url(#whiteBaseGrad)" 
      stroke="#969ca6"
      stroke-width="0.3"
    />
    <!-- Collar Highlight Line -->
    <path d="M 12.5,37.75 L 35.5,37.75" stroke="url(#whiteEdgeLight)" stroke-width="0.45" stroke-linecap="round" />

    <!-- Lower Flared Trapezoid Pedestal -->
    <path 
      d="M 10.5,39 L 37.5,39 C 38.8,39 40,41 40,42.2 C 40,43 39.2,43.5 38,43.5 L 10,43.5 C 8.8,43.5 8,43 8,42.2 C 8,41 9.2,39 10.5,39 Z" 
      fill="url(#whiteBaseGrad)" 
      stroke="#969ca6"
      stroke-width="0.35"
    />
    <!-- Base Top Bevel Highlight -->
    <path d="M 10.5,39.35 L 37.5,39.35" stroke="url(#whiteEdgeLight)" stroke-width="0.6" stroke-linecap="round" />
    <!-- Base Bottom Shadow Line -->
    <path d="M 8.5,43.15 L 39.5,43.15" stroke="#7a808a" stroke-width="0.5" stroke-opacity="0.8" stroke-linecap="round" />

  </g>
</svg>
